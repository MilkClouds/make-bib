name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v7

      - name: Validate skill
        run: |
          uvx --from git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref \
            skills-ref validate skills/fetch-bib

      - name: Test universal installation
        run: |
          cd "$(mktemp -d)"
          npx --yes skills@latest add "$GITHUB_WORKSPACE" \
            --skill fetch-bib --agent universal --copy --yes
          test -f .agents/skills/fetch-bib/SKILL.md
          cmp .agents/skills/fetch-bib/SKILL.md \
            "$GITHUB_WORKSPACE/skills/fetch-bib/SKILL.md"
          test "$(jq -r '.plugins[0].skills[0]' \
            "$GITHUB_WORKSPACE/.claude-plugin/marketplace.json")" = "./skills/fetch-bib"
